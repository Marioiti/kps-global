// ═══ STORAGE ═══════════════════════════════════════════════════════
const DB = {
  async get(k) {
    try {
      const snap = await firebase.database().ref(k.replace(/[.#$/\[\]]/g, "_")).once("value");
      return snap.val();
    } catch { return null; }
  },
  async set(k, v) {
    try {
      await firebase.database().ref(k.replace(/[.#$/\[\]]/g, "_")).set(v);
      return true;
    } catch { return false; }
  },
  async del(k) {
    try { await firebase.database().ref(k.replace(/[.#$/\[\]]/g, "_")).remove(); } catch {}
  },
};

const fmt = n => n != null ? new Intl.NumberFormat("id-ID").format(n) : "—";

const recalcInvoice = (inv) => {
  inv.subtotal = (inv.items||[]).reduce((s,it) => s + (it.qty||0)*(it.price||0), 0);
  const disc = inv.discountEnabled ? (inv.discountAmount||0) : 0;
  const afterDisc = inv.subtotal - disc;
  const ppn = inv.ppnEnabled ? Math.round(afterDisc * (inv.ppnRate||11) / 100 * (inv.ppnMode==="extra"?1:0)) : 0;
  const pph = inv.pphEnabled ? Math.round(afterDisc * (inv.pphRate||2.85) / 100) : 0;
  inv.retention = inv.retentionEnabled ? Math.round(afterDisc * 0.05) : 0;
  inv.taxPPN = ppn;
  inv.taxPPH = pph;
  inv.total = afterDisc + ppn - pph - inv.retention;
};

function MiniGantt({phases,projectStart,projectEnd,totalWeeks=22}) {
  const pStart = projectStart ? new Date(projectStart) : new Date("2026-04-07");
  const pEnd = projectEnd ? new Date(projectEnd) : new Date(pStart.getTime()+totalWeeks*7*864e5);
  const totalMs = pEnd-pStart || 1;
  const nowMs = Date.now()-pStart;
  const nowPct = Math.max(0,Math.min(100,(nowMs/totalMs)*100));

  const getBar = (ph) => {
    if(ph.phaseStart&&ph.phaseEnd) {
      const s=Math.max(0,(new Date(ph.phaseStart)-pStart)/totalMs*100);
      const e=Math.min(100,(new Date(ph.phaseEnd)-pStart)/totalMs*100);
      return {left:`${s}%`,width:`${Math.max(2,e-s)}%`};
    }
    return {left:`${((ph.startWeek-1)/totalWeeks)*100}%`,width:`${(((ph.endWeek||ph.startWeek)-ph.startWeek+1)/totalWeeks)*100}%`};
  };

  // Week labels
  const weeks = [];
  for(let i=0;i<totalWeeks;i++){
    const d=new Date(pStart.getTime()+i*7*864e5);
    weeks.push({label:`W${i+1}`,date:d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit"})});
  }

  return <div style={{overflowX:"auto"}}><div style={{minWidth:560,position:"relative"}}>
    <div style={{display:"flex",marginBottom:4,paddingLeft:160}}>{weeks.map((w,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:7,color:"#94a3b8"}}>{i%3===0?w.date:""}</div>)}</div>
    {phases.map(p=>{const bar=getBar(p); return <div key={p.id} style={{display:"flex",alignItems:"center",marginBottom:4}}>
      <div style={{width:156,flexShrink:0,fontSize:10,color:"#334155",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:6}}>{p.name}</div>
      <div style={{flex:1,position:"relative",height:18,background:"#f1f5f9",borderRadius:3}}>
        <div style={{position:"absolute",left:bar.left,width:bar.width,top:2,bottom:2,borderRadius:2,background:p.color,opacity:p.status==="upcoming"?.3:p.status==="done"?1:.75}}>
          {p.progress>0&&<div style={{height:"100%",width:`${p.progress}%`,borderRadius:2,background:p.color}}/>}
        </div>
        <div style={{position:"absolute",left:`${nowPct}%`,top:0,bottom:0,width:1.5,background:"#f59e0b",zIndex:2}}/>
      </div>
    </div>;})}
  </div></div>;
}

  return <div style={{overflowX:"auto"}}>

      </tr></thead>
      <tbody>
        {boq.sections.map((sec,si)=>{
          let secTotal = 0;
          return [
            <tr key={`s${si}`} style={{background:"#eff6ff"}}><td colSpan={6} style={{padding:"10px",fontWeight:700,color:"#1e40af",fontSize:13}}>{sec.name}</td></tr>,
            ...sec.items.map((it,ii)=>{
              const lineTotal = (it.qty||0)*(it.price||0);
              secTotal += lineTotal;
              grandTotal += lineTotal;
              return <tr key={`i${si}-${ii}`} style={{borderBottom:"1px solid #f1f5f9"}}>
                <td style={{padding:"8px 10px",color:"#94a3b8"}}>{si+1}.{ii+1}</td>
                <td style={{padding:"8px 10px",color:"#0f172a"}}>{it.name}</td>
                <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace"}}>{it.qty||"—"}</td>
                <td style={{padding:"8px 10px",color:"#64748b"}}>{it.unit||""}</td>
                <td style={{padding:"8px 10px",textAlign:"right",fontFamily:"monospace"}}>{fmt(it.price)}</td>
                <td style={{padding:"8px 10px",textAlign:"right",fontWeight:600,fontFamily:"monospace"}}>{fmt(lineTotal)}</td>
              </tr>;
            }),
            <tr key={`st${si}`} style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}><td colSpan={5} style={{padding:"8px 10px",fontWeight:700,textAlign:"right",color:"#334155"}}>Subtotal {sec.name}</td><td style={{padding:"8px 10px",textAlign:"right",fontWeight:800,fontFamily:"monospace",color:"#1e40af"}}>{fmt(secTotal)}</td></tr>,
          ];
        })}
        <tr style={{background:"#1e293b"}}><td colSpan={5} style={{padding:"12px",fontWeight:800,textAlign:"right",color:"#fff",fontSize:13}}>GRAND TOTAL</td><td style={{padding:"12px",textAlign:"right",fontWeight:800,fontFamily:"monospace",color:"#fff",fontSize:14}}>{fmt(grandTotal)}</td></tr>
      </tbody>
    </table>
  </div>;
}

// ═══ BOQ EDITOR (admin) ═══════════════════════════════════════════
function BOQEditor({boq,onChange}) {
  const data = boq || {sections:[]};
  const update = (fn) => { const next = JSON.parse(JSON.stringify(data)); fn(next); onChange(next); };

  const addSection = () => update(d => d.sections.push({id:uid(),name:"New Section",items:[]}));
  const removeSection = (si) => update(d => d.sections.splice(si,1));
  const updateSection = (si,field,val) => update(d => { d.sections[si][field]=val; });
  const addItem = (si) => update(d => d.sections[si].items.push({id:uid(),name:"",qty:0,unit:"",price:0}));
  const removeItem = (si,ii) => update(d => d.sections[si].items.splice(ii,1));
  const updateItem = (si,ii,field,val) => update(d => { d.sections[si].items[ii][field] = field==="qty"||field==="price" ? parseFloat(val)||0 : val; });

  return <div>
    {data.sections.map((sec,si) => (
      <div key={sec.id||si} style={{background:"#111827",borderRadius:12,border:"1px solid #374151",padding:16,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <input value={sec.name} onChange={e=>updateSection(si,"name",e.target.value)} style={{flex:1,padding:"8px 10px",borderRadius:8,border:"1px solid #374151",background:"#1f2937",color:"#f1f5f9",fontSize:13,fontWeight:700,outline:"none"}} />
          <Btn v="danger" onClick={()=>removeSection(si)} style={{padding:"6px 10px",fontSize:11}}>✕</Btn>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{borderBottom:"1px solid #374151"}}>
            {["Item","Qty","Unit","Price/Unit","Total",""].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",color:"#6b7280",fontSize:10,fontWeight:600}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {sec.items.map((it,ii)=>{
              const tot = (it.qty||0)*(it.price||0);
              return <tr key={it.id||ii} style={{borderBottom:"1px solid #1f2937"}}>
                <td style={{padding:4}}><input value={it.name} onChange={e=>updateItem(si,ii,"name",e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #374151",background:"#1f2937",color:"#d1d5db",fontSize:12,outline:"none",boxSizing:"border-box"}} /></td>
                <td style={{padding:4,width:70}}><input type="number" value={it.qty} onChange={e=>updateItem(si,ii,"qty",e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #374151",background:"#1f2937",color:"#d1d5db",fontSize:12,outline:"none",textAlign:"right",boxSizing:"border-box"}} /></td>
                <td style={{padding:4,width:60}}><input value={it.unit||""} onChange={e=>updateItem(si,ii,"unit",e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #374151",background:"#1f2937",color:"#d1d5db",fontSize:12,outline:"none",boxSizing:"border-box"}} /></td>
                <td style={{padding:4,width:100}}><input type="number" value={it.price} onChange={e=>updateItem(si,ii,"price",e.target.value)} style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #374151",background:"#1f2937",color:"#d1d5db",fontSize:12,outline:"none",textAlign:"right",boxSizing:"border-box"}} /></td>
                <td style={{padding:"4px 8px",color:"#60a5fa",fontWeight:700,fontFamily:"monospace",fontSize:12,textAlign:"right"}}>{fmt(tot)}</td>
                <td style={{padding:4,width:30}}><button onClick={()=>removeItem(si,ii)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:14}}>✕</button></td>
              </tr>;
            })}
          </tbody>
        </table>
        <Btn v="dark" onClick={()=>addItem(si)} style={{marginTop:8,fontSize:11}}>+ Add Item</Btn>
      </div>
    ))}
    <Btn v="primary" onClick={addSection} style={{marginTop:4}}>+ Add Section</Btn>
  </div>;
}

// ═══ COMMENTS PANEL (for supervisors) ═════════════════════════════
function CommentsPanel({comments:initComments,role,projectId}) {
  const [comments,setComments]=useState(initComments||[]);
  const [text,setText]=useState("");
  const [phase,setPhase]=useState("");
  const loaded=useRef(false);

  useEffect(()=>{(async()=>{
    const stored=await DB.get(`kps-comments:${projectId}`);
    if(stored) setComments(stored);
    else if(initComments?.length) await DB.set(`kps-comments:${projectId}`,initComments);
    loaded.current=true;
  })();},[projectId]);

  const add=async()=>{
    if(!text.trim()) return;
    const next=[{id:uid(),date:today(),author:role==="tech"?"Technical Supervisor":"Author Supervisor",role,text,phase:phase||"General",resolved:false},...comments];
    setComments(next);
    await DB.set(`kps-comments:${projectId}`,next);
    setText("");
  };
  const toggle=async(id)=>{
    const next=comments.map(c=>c.id===id?{...c,resolved:!c.resolved}:c);
    setComments(next);
    await DB.set(`kps-comments:${projectId}`,next);
  };

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Card>
      <Sec title="New Comment / Замечание">
        <Inp label="Related Phase" value={phase} onChange={setPhase} ph="e.g. Retaining Wall, or General"/>
        <div style={{marginBottom:12}}><label style={{display:"block",fontSize:11,fontWeight:600,color:"#64748b",marginBottom:4}}>Comment</label>
          <textarea value={text} onChange={e=>setText(e.target.value)} rows={3} placeholder="Describe your observation, issue, or recommendation..."
            style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #d1d5db",fontSize:13,resize:"vertical",boxSizing:"border-box",fontFamily:"inherit",outline:"none"}}/>
        </div>
        <Btn onClick={add}>✓ Post Comment</Btn>
      </Sec>
    </Card>
    <Card>
      <Sec title={`Comments (${comments.length})`}>
        {comments.length===0?<div style={{color:"#94a3b8",padding:20,textAlign:"center"}}>No comments yet</div>:
        comments.map(c=>(
          <div key={c.id} style={{padding:"12px 0",borderBottom:"1px solid #f1f5f9",opacity:c.resolved?.6:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <RoleBadge role={c.role}/>
              <span style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>{c.author}</span>
              <span style={{fontSize:10,color:"#94a3b8"}}>{fmtDate(c.date)}</span>
              {c.phase&&<span style={{fontSize:10,color:"#2563eb",background:"#eff6ff",padding:"1px 6px",borderRadius:4}}>{c.phase}</span>}
              <div style={{flex:1}}/>
              <button onClick={()=>toggle(c.id)} style={{fontSize:10,color:c.resolved?"#059669":"#d97706",background:c.resolved?"#ecfdf5":"#fefce8",border:`1px solid ${c.resolved?"#a7f3d0":"#fde68a"}`,borderRadius:6,padding:"2px 8px",cursor:"pointer",fontWeight:600}}>
                {c.resolved?"✓ Resolved":"○ Open"}
              </button>
            </div>
            <div style={{fontSize:12,color:"#334155",lineHeight:1.6,paddingLeft:4}}>{c.text}</div>
          </div>
        ))}
      </Sec>
    </Card>
  </div>;
}

        </div>)}</div>}

        {tab==="boq"&&<Card><Sec title="Bill of Quantities / Estimate"><BOQView boq={p.boq}/></Sec></Card>}

        {tab==="comments"&&<CommentsPanel comments={p.comments||[]} role={role} projectId={p.id}/>}

        {tab==="finance"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            <Card><div style={{fontSize:11,color:"#64748b",fontWeight:600}}>Contract Value</div><div style={{fontSize:18,fontWeight:800,marginTop:4}}>{fmt(p.totalValue)}</div></Card>
            <Card><div style={{fontSize:11,color:"#64748b",fontWeight:600}}>Paid</div><div style={{fontSize:18,fontWeight:800,color:"#059669",marginTop:4}}>{fmt(totalPaid)}</div></Card>
            <Card><div style={{fontSize:11,color:"#64748b",fontWeight:600}}>Retention 5%</div><div style={{fontSize:18,fontWeight:800,color:"#d97706",marginTop:4}}>{fmt(Math.round(totalPaid*.05))}</div></Card>
          </div>
          <Card><Sec title="Payment Schedule"><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:"2px solid #e2e8f0"}}>{["#","Phase","Desc","%","Amount","Due","Status"].map(h=><th key={h} style={{padding:"7px 8px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:10}}>{h}</th>)}</tr></thead><tbody>{p.payments.map(pay=><tr key={pay.id} style={{borderBottom:"1px solid #f1f5f9"}}><td style={{padding:8,color:"#94a3b8"}}>{pay.id}</td><td style={{padding:8,fontWeight:600}}>{pay.phase}</td><td style={{padding:8,color:"#64748b",fontSize:11}}>{pay.desc}</td><td style={{padding:8}}>{pay.pct}%</td><td style={{padding:8,fontWeight:700,fontFamily:"monospace"}}>{fmt(pay.amount)}</td><td style={{padding:8,color:"#64748b"}}>{fmtDate(pay.dueDate)}</td><td style={{padding:8}}><Badge status={pay.status}/></td></tr>)}</tbody></table></div></Sec></Card>
        </div>}

        {tab==="invoices"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          {(!p.invoices||p.invoices.length===0)?<Card><div style={{padding:30,textAlign:"center",color:"#94a3b8"}}>No invoices issued yet</div></Card>:
          p.invoices.filter(inv=>inv.status!=="draft").map(inv=>(
            <Card key={inv.id} style={{border:inv.status==="overdue"?"1px solid #fca5a5":"1px solid #e2e8f0"}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
                <div>
                  <div style={{fontSize:15,fontWeight:800,color:"#0f172a"}}>{inv.number}</div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{inv.description}</div>
                </div>
                <Badge status={inv.status}/>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,marginBottom:12}}>
                  <thead><tr style={{borderBottom:"2px solid #e2e8f0"}}>
                    {["Description","Qty","Unit","Price","Total"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:10}}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {(inv.items||[]).map((it,i)=><tr key={i} style={{borderBottom:"1px solid #f1f5f9"}}>
                      <td style={{padding:"6px 8px"}}>{it.desc}</td>
                      <td style={{padding:"6px 8px",textAlign:"right",fontFamily:"monospace"}}>{it.qty}</td>
                      <td style={{padding:"6px 8px",color:"#64748b"}}>{it.unit}</td>
                      <td style={{padding:"6px 8px",textAlign:"right",fontFamily:"monospace"}}>{fmt(it.price)}</td>
                      <td style={{padding:"6px 8px",textAlign:"right",fontWeight:600,fontFamily:"monospace"}}>{fmt((it.qty||0)*(it.price||0))}</td>
                    </tr>)}
                  </tbody>
                </table>
              </div>
              <div style={{display:"flex",justifyContent:"flex-end"}}>
                <div style={{width:280}}>
                  <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}><span style={{color:"#64748b"}}>Subtotal</span><span style={{fontFamily:"monospace",fontWeight:600}}>{fmt(inv.subtotal)}</span></div>
                  {inv.retention>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}><span style={{color:"#d97706"}}>Retention 5%</span><span style={{fontFamily:"monospace",color:"#d97706"}}>-{fmt(inv.retention)}</span></div>}
                  <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",fontSize:14,borderTop:"2px solid #e2e8f0",marginTop:4}}><span style={{fontWeight:800}}>Total Due</span><span style={{fontWeight:800,fontFamily:"monospace"}}>{fmt(inv.total)} IDR</span></div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,paddingTop:10,borderTop:"1px solid #f1f5f9",fontSize:11,color:"#94a3b8"}}>
                <span>Issued: {fmtDate(inv.date)}</span>
                <span>Due: {fmtDate(inv.dueDate)}</span>
                {inv.paidDate&&<span style={{color:"#059669",fontWeight:600}}>Paid: {fmtDate(inv.paidDate)}</span>}
              </div>
              {inv.notes&&<div style={{marginTop:8,fontSize:11,color:"#64748b",fontStyle:"italic"}}>{inv.notes}</div>}
            </Card>
          ))}
        </div>}

        {tab==="materials"&&<Card><Sec title="Materials"><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:"2px solid #e2e8f0"}}>{["Material","Qty","Supplier","ETA","Status"].map(h=><th key={h} style={{padding:"7px 8px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:10}}>{h}</th>)}</tr></thead><tbody>{p.materials.map(m=><tr key={m.id} style={{borderBottom:"1px solid #f1f5f9"}}><td style={{padding:8,fontWeight:600}}>{m.name}</td><td style={{padding:8,color:"#64748b"}}>{m.qty}</td><td style={{padding:8,color:"#64748b"}}>{m.supplier}</td><td style={{padding:8,color:"#64748b"}}>{m.eta}</td><td style={{padding:8}}><Badge status={m.status}/></td></tr>)}</tbody></table></Sec></Card>}

        {tab==="photos"&&<Card><Sec title="Photos"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}}>{p.photos.map(ph=><div key={ph.id} style={{borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}><div style={{height:140,background:ph.data?`url(${ph.data}) center/cover`:"linear-gradient(135deg,#e2e8f0,#cbd5e1)",display:"flex",alignItems:"center",justifyContent:"center"}}>{!ph.data&&<span style={{color:"#94a3b8",fontSize:24}}>📷</span>}</div><div style={{padding:8}}><div style={{fontSize:11,fontWeight:600}}>{ph.caption}</div><div style={{fontSize:10,color:"#94a3b8"}}>{fmtDate(ph.date)}</div></div></div>)}</div></Sec></Card>}

        {tab==="docs"&&<Card><Sec title="Documents">{p.documents.map((d,i)=><div key={d.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<p.documents.length-1?"1px solid #f1f5f9":"none"}}><div style={{width:34,height:34,borderRadius:8,background:d.type==="pdf"?"#fef2f2":"#f0fdf4",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:9,fontWeight:800,color:d.type==="pdf"?"#dc2626":"#059669",textTransform:"uppercase"}}>{d.type}</span></div><div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{d.name}</div><div style={{fontSize:10,color:"#94a3b8"}}>{fmtDate(d.date)} — {d.size}</div></div></div>)}</Sec></Card>}

        {tab==="updates"&&<Card><Sec title="Timeline">{p.updates.map((u,i)=><div key={u.id} style={{display:"flex",gap:12,marginBottom:16,position:"relative"}}>{i<p.updates.length-1&&<div style={{position:"absolute",left:13,top:28,bottom:-16,width:2,background:"#e2e8f0"}}/>}<div style={{width:28,height:28,borderRadius:999,flexShrink:0,background:u.type==="milestone"?"#fef3c7":"#e0e7ff",border:`2px solid ${u.type==="milestone"?"#fcd34d":"#a5b4fc"}`,display:"flex",alignItems:"center",justifyContent:"center",zIndex:1,fontSize:11}}>{u.type==="milestone"?"★":"●"}</div><div><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:700}}>{u.title}</span><Badge status={u.type}/></div><div style={{fontSize:11,color:"#64748b",marginTop:2}}>{u.text}</div><div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{fmtDate(u.date)}</div></div></div>)}</Sec></Card>}
      </main>
    </div>
  </div>;
}

// ═══ ADMIN PANEL ══════════════════════════════════════════════════
function Admin({projects,onSelectProject,onCreateProject,onLogout,adminKey,onChangeAdminKey}) {
  const [showNew,setShowNew]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [adminTab,setAdminTab]=useState("projects");
  const [newAdminKey,setNewAdminKey]=useState("");
  const [keyMsg,setKeyMsg]=useState(null);
  const [nf,setNf]=useState({name:"",client:"",contract:"",location:"",total:"",startDate:"",endDate:""});

  const changeKey = () => {
    const k = newAdminKey.trim();
    if(!k||k.length<6){setKeyMsg("Key must be at least 6 characters");return;}
    onChangeAdminKey(k);
    setNewAdminKey("");
    setKeyMsg("✓ Admin key changed to: "+k);
    setTimeout(()=>setKeyMsg(null),4000);
  };

  const [aiLoading,setAiLoading]=useState(false);
  const [aiStatus,setAiStatus]=useState("");
  const [aiFiles,setAiFiles]=useState([]);
  const [aiResult,setAiResult]=useState(null);
  const fileInputRef=useRef(null);

  const handleFiles = (e) => {
    const files = Array.from(e.target.files||[]);
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = (ev) => {
        setAiFiles(prev=>[...prev,{name:file.name,type:file.type,size:file.size,data:ev.target.result}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const analyzeWithAI = async () => {
    if(aiFiles.length===0){setAiStatus("Upload at least one file");return;}
    setAiLoading(true);setAiStatus("Analyzing documents with AI...");
    try {
      const docContents = aiFiles.map(f => {
        const base64 = f.data.split(",")[1];
        if(f.type==="application/pdf") return {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}};
        if(f.type.startsWith("image/")) return {type:"image",source:{type:"base64",media_type:f.type,data:base64}};
        return {type:"text",text:`File: ${f.name} (${f.type}) — binary content not shown`};
      });

      const response = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",max_tokens:4000,
          system:`You are a construction project analyst. Extract project data from uploaded documents (contracts, BOQ, schedules). Return ONLY valid JSON with no markdown, no preamble. Structure:
{"project":"name","client":"name","contract":"number","location":"address","startDate":"YYYY-MM-DD","endDate":"YYYY-MM-DD","totalValue":number,
"phases":[{"name":"Phase Name","value":number,"phaseStart":"YYYY-MM-DD","phaseEnd":"YYYY-MM-DD","items":[{"name":"sub-item"}]}],
"boq":{"sections":[{"name":"Section","items":[{"name":"item","qty":number,"unit":"unit","price":number}]}]},
"payments":[{"phase":"Payment Name","desc":"description","pct":number,"amount":number,"dueDate":"YYYY-MM-DD"}]}
If data is missing, use reasonable estimates. All amounts in IDR.`,
          messages:[{role:"user",content:[...docContents,{type:"text",text:`Analyze these construction documents. Extract: project info, work phases with dates, BOQ/estimate breakdown, and payment schedule. Project name: ${nf.name||"Unknown"}, Client: ${nf.client||"Unknown"}. Return JSON only.`}]}]
        })
      });
      const data = await response.json();
      const text = data.content?.map(c=>c.text||"").join("")||"";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setAiResult(parsed);
      // Auto-fill form fields from AI
      if(parsed.project && !nf.name) setNf(prev=>({...prev,name:parsed.project}));
      if(parsed.client && !nf.client) setNf(prev=>({...prev,client:parsed.client}));
      if(parsed.contract && !nf.contract) setNf(prev=>({...prev,contract:parsed.contract}));
      if(parsed.location && !nf.location) setNf(prev=>({...prev,location:parsed.location}));
      if(parsed.totalValue && !nf.total) setNf(prev=>({...prev,total:String(parsed.totalValue)}));
      if(parsed.startDate) setNf(prev=>({...prev,startDate:parsed.startDate}));
      if(parsed.endDate) setNf(prev=>({...prev,endDate:parsed.endDate}));
      setAiStatus(`✓ Analysis complete — ${parsed.phases?.length||0} phases, ${parsed.boq?.sections?.length||0} BOQ sections, ${parsed.payments?.length||0} payments extracted`);
    } catch(err) {
      console.error(err);
      setAiStatus("AI analysis failed: "+err.message+". You can still create the project manually.");
    }
    setAiLoading(false);
  };

  const COLORS=["#2563eb","#0891b2","#d97706","#059669","#dc2626","#7c3aed","#4f46e5","#db2777","#ea580c","#65a30d"];

  const create = () => {
    if(!nf.name||!nf.client) return;
    const id = nf.name.slice(0,3).toUpperCase()+"-"+new Date().getFullYear()+"-"+uid().slice(0,3).toUpperCase();
    const ai = aiResult;

    // Build phases from AI or default
    const phases = ai?.phases?.length ? ai.phases.map((ph,i)=>({
      id:i+1,name:ph.name,nameRu:"",value:ph.value||0,progress:0,status:"upcoming",
      startWeek:1,endWeek:22,color:COLORS[i%COLORS.length],
      phaseStart:ph.phaseStart||nf.startDate||"",phaseEnd:ph.phaseEnd||nf.endDate||"",
      items:(ph.items||[]).map(it=>({name:it.name,status:"pending"})),
    })) : [{id:1,name:"Phase 1",nameRu:"",value:parseFloat(nf.total)||0,progress:0,status:"upcoming",startWeek:1,endWeek:22,color:COLORS[0],phaseStart:nf.startDate||"",phaseEnd:nf.endDate||"",items:[]}];

    const payments = ai?.payments?.length ? ai.payments.map((pay,i)=>({
      id:i+1,phase:pay.phase,desc:pay.desc||"",pct:pay.pct||0,amount:pay.amount||0,dueDate:pay.dueDate||"",status:"upcoming",paidDate:null,
    })) : [{id:1,phase:"Down Payment",desc:"Mobilization",pct:15,amount:Math.round((parseFloat(nf.total)||0)*0.15),dueDate:"",status:"upcoming",paidDate:null}];

    const boq = ai?.boq?.sections?.length ? {sections:ai.boq.sections.map(s=>({id:uid(),name:s.name,items:(s.items||[]).map(it=>({id:uid(),name:it.name,qty:it.qty||0,unit:it.unit||"",price:it.price||0}))}))} : {sections:[]};

    onCreateProject({
      id,project:nf.name,client:nf.client,
      contract:nf.contract||`NEW/${new Date().getFullYear()}`,
      location:nf.location||"",
      startDate:nf.startDate||today(),endDate:nf.endDate||"",
      totalValue:parseFloat(nf.total)||0,
      contractor:"",overallProgress:0,
      accessKeys:[
        {key:id,role:"client",label:`Client — ${nf.client}`},
        {key:id.replace(/-[^-]+$/,"")+"-TECH-"+new Date().getFullYear(),role:"tech",label:"Technical Supervisor"},
        {key:id.replace(/-[^-]+$/,"")+"-AUTH-"+new Date().getFullYear(),role:"author",label:"Author Supervisor"},
      ],
      phases,payments,boq,
      materials:[],updates:[{id:uid(),date:today(),title:"Project created",text:`New project: ${nf.name}${ai?" (AI-analyzed)":""}`,type:"milestone"}],
      comments:[],documents:[],photos:[],invoices:[],ledger:[],
    });
    setShowNew(false);
    setNf({name:"",client:"",contract:"",location:"",total:"",startDate:"",endDate:""});
    setAiFiles([]);setAiResult(null);setAiStatus("");
  };

  return <div style={{minHeight:"100vh",background:"#111827",fontFamily:"'DM Sans','Segoe UI',sans-serif"}}>
    <header style={{position:"sticky",top:0,zIndex:50,background:"rgba(17,24,39,.95)",backdropFilter:"blur(12px)",borderBottom:"1px solid #1f2937",padding:"0 24px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",height:56}}>
        <div style={{width:32,height:32,borderRadius:8,marginRight:12,background:"linear-gradient(135deg,#dc2626,#f59e0b)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:12,fontWeight:800,color:"#fff"}}>ADM</span></div>
        <span style={{fontSize:14,fontWeight:700,color:"#f1f5f9"}}>KPS Admin</span>
        <span style={{fontSize:11,color:"#6b7280",marginLeft:12}}>Project Management</span>
        <div style={{flex:1}}/>
        <Btn onClick={()=>setShowSettings(!showSettings)} v="ghost" style={{color:"#9ca3af",borderColor:"#374151",padding:"5px 12px",marginRight:8}}>⚙ Settings</Btn>
        <Btn onClick={onLogout} v="ghost" style={{color:"#9ca3af",borderColor:"#374151",padding:"5px 12px"}}>Logout</Btn>
      </div>
    </header>
    <div style={{maxWidth:1200,margin:"0 auto",padding:24}}>
      {/* Admin tabs */}
      <div style={{display:"flex",gap:4,marginBottom:20,borderBottom:"1px solid #374151",paddingBottom:12}}>
        {[{id:"projects",l:"◉ Projects"},{id:"pnl",l:"📊 P&L"},{id:"counterparties",l:"👥 Counterparties"}].map(t=>(
          <button key={t.id} onClick={()=>{setAdminTab(t.id);setShowNew(false);setShowSettings(false);}} style={{padding:"8px 16px",borderRadius:8,border:"none",background:adminTab===t.id?"rgba(37,99,235,.2)":"transparent",color:adminTab===t.id?"#60a5fa":"#9ca3af",fontSize:12,fontWeight:adminTab===t.id?700:500,cursor:"pointer"}}>{t.l}</button>
        ))}
      </div>

      {adminTab==="projects"&&<>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <h2 style={{color:"#f1f5f9",fontSize:18,fontWeight:700,margin:0}}>Projects ({projects.length})</h2>
        <Btn onClick={()=>setShowNew(!showNew)}>+ New Project</Btn>
      </div>

      {showSettings&&<Card dark style={{marginBottom:20}}>
        <Sec title="Admin Settings">
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:600,color:"#d1d5db",marginBottom:8}}>Admin Access Key</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{fontSize:11,color:"#6b7280"}}>Current key:</span>
              <code style={{fontSize:13,color:"#60a5fa",fontFamily:"'JetBrains Mono',monospace",letterSpacing:1,background:"#111827",padding:"4px 10px",borderRadius:6,border:"1px solid #374151"}}>{adminKey}</code>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              <Inp dark label="New Admin Key" value={newAdminKey} onChange={setNewAdminKey} ph="Enter new admin key (min 6 chars)" style={{flex:1,marginBottom:0}}/>
              <Btn onClick={changeKey} style={{whiteSpace:"nowrap"}}>Change Key</Btn>
            </div>
            {keyMsg&&<p style={{fontSize:11,color:keyMsg.startsWith("✓")?"#34d399":"#f87171",marginTop:6}}>{keyMsg}</p>}
          </div>
          <div style={{borderTop:"1px solid #374151",paddingTop:14}}>
            <div style={{fontSize:12,fontWeight:600,color:"#d1d5db",marginBottom:8}}>Project Access Keys</div>
            <p style={{fontSize:11,color:"#6b7280",lineHeight:1.6,marginBottom:10}}>Each project has its own keys for Client, Technical Supervisor, and Author Supervisor. Edit them inside each project → Access Keys tab.</p>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {projects.map(p=>(
                <div key={p.id} style={{background:"#111827",borderRadius:8,padding:10,border:"1px solid #374151"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#f1f5f9",marginBottom:6}}>{p.project}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {(p.accessKeys||[]).map(ak=>(
                      <div key={ak.key} style={{display:"flex",alignItems:"center",gap:6,background:"#1f2937",padding:"4px 10px",borderRadius:6,border:"1px solid #374151"}}>
                        <code style={{fontSize:11,color:"#60a5fa",fontFamily:"monospace"}}>{ak.key}</code>
                        <RoleBadge role={ak.role}/>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Sec>
      </Card>}

      {showNew&&<Card dark style={{marginBottom:20}}>
        <Sec title="Create New Project">
          {/* File upload for AI analysis */}
          <div style={{background:"#111827",borderRadius:10,padding:16,border:"1px solid #374151",marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#60a5fa",marginBottom:8}}>📎 Upload Documents for AI Analysis</div>
            <p style={{fontSize:11,color:"#6b7280",marginBottom:10,lineHeight:1.5}}>Upload contract, BOQ, schedule PDFs — AI will extract phases, estimates, and payment plans automatically.</p>
            <input ref={fileInputRef} type="file" multiple accept=".pdf,image/*" onChange={handleFiles}
              style={{fontSize:11,color:"#d1d5db",marginBottom:8,display:"block"}}/>
            {aiFiles.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {aiFiles.map((f,i)=><div key={i} style={{background:"#1f2937",padding:"4px 10px",borderRadius:6,border:"1px solid #374151",fontSize:10,color:"#d1d5db",display:"flex",alignItems:"center",gap:6}}>
                <span style={{color:f.type==="application/pdf"?"#f87171":"#34d399"}}>■</span>{f.name} ({(f.size/1024).toFixed(0)}KB)
                <button onClick={()=>setAiFiles(prev=>prev.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:10}}>✕</button>
              </div>)}
            </div>}
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <Btn onClick={analyzeWithAI} disabled={aiLoading||aiFiles.length===0} style={{background:aiLoading?"#374151":"linear-gradient(135deg,#7c3aed,#2563eb)"}}>
                {aiLoading?"⟳ Analyzing...":"🤖 Analyze with AI"}
              </Btn>
              {aiStatus&&<span style={{fontSize:11,color:aiStatus.startsWith("✓")?"#34d399":aiStatus.startsWith("AI analysis failed")?"#f87171":"#f59e0b"}}>{aiStatus}</span>}
            </div>
            {aiResult&&<div style={{marginTop:10,padding:10,background:"#1f2937",borderRadius:8,border:"1px solid #374151"}}>
              <div style={{fontSize:10,color:"#34d399",fontWeight:600,marginBottom:4}}>AI extracted:</div>
              <div style={{fontSize:10,color:"#9ca3af",lineHeight:1.6}}>
                {aiResult.phases?.length>0&&<span>Phases: {aiResult.phases.map(p=>p.name).join(", ")}<br/></span>}

// ═══ GLOBAL P&L (across all projects) ═════════════════════════════
function GlobalPnL({projects}) {
  const allLedger = projects.flatMap(p=>(p.ledger||[]).map(e=>({...e,projectName:p.project})));
  const sorted = [...allLedger].sort((a,b)=>b.date.localeCompare(a.date));
  const totI = allLedger.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);
  const totE = allLedger.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
  const profit = totI-totE;

  // By project
  const byProj = {};
  allLedger.forEach(e=>{
    if(!byProj[e.projectName]) byProj[e.projectName]={income:0,expense:0};
    if(e.type==="income") byProj[e.projectName].income+=e.amount;
    if(e.type==="expense") byProj[e.projectName].expense+=e.amount;
  });

  // By account
  const byAcc = {};
  allLedger.forEach(e=>{
    if(!e.account) return;
    if(!byAcc[e.account]) byAcc[e.account]={income:0,expense:0};
    if(e.type==="income") byAcc[e.account].income+=e.amount;
    if(e.type==="expense") byAcc[e.account].expense+=e.amount;
  });

  // By month
  const byMonth = {};
  allLedger.forEach(e=>{
    const m=e.date?.slice(0,7)||"unknown";
    if(!byMonth[m]) byMonth[m]={income:0,expense:0};
    if(e.type==="income") byMonth[m].income+=e.amount;
    if(e.type==="expense") byMonth[m].expense+=e.amount;
  });

  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <h2 style={{color:"#f1f5f9",fontSize:18,fontWeight:700,margin:0}}>P&L — All Projects</h2>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
      <div style={{background:"#1f2937",borderRadius:10,padding:16,border:"1px solid #374151",textAlign:"center"}}><div style={{fontSize:10,color:"#6b7280"}}>Total Income</div><div style={{fontSize:22,fontWeight:800,color:"#34d399",fontFamily:"monospace",marginTop:4}}>{fmt(totI)}</div></div>
      <div style={{background:"#1f2937",borderRadius:10,padding:16,border:"1px solid #374151",textAlign:"center"}}><div style={{fontSize:10,color:"#6b7280"}}>Total Expenses</div><div style={{fontSize:22,fontWeight:800,color:"#f87171",fontFamily:"monospace",marginTop:4}}>{fmt(totE)}</div></div>
      <div style={{background:"#1f2937",borderRadius:10,padding:16,border:`1px solid ${profit>=0?"#374151":"#7f1d1d"}`,textAlign:"center"}}><div style={{fontSize:10,color:"#6b7280"}}>Net Profit</div><div style={{fontSize:22,fontWeight:800,color:profit>=0?"#34d399":"#f87171",fontFamily:"monospace",marginTop:4}}>{fmt(profit)}</div></div>
    </div>

    {/* By project */}
    <div style={{background:"#1f2937",borderRadius:14,border:"1px solid #374151",padding:18}}>
      <Sec title="By Project">
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{borderBottom:"2px solid #374151"}}>{["Project","Income","Expenses","Profit","Margin"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#6b7280",fontWeight:600,fontSize:10}}>{h}</th>)}</tr></thead>
          <tbody>{Object.entries(byProj).map(([name,d])=>{const pr=d.income-d.expense;const mg=d.income>0?Math.round(pr/d.income*100):0;return <tr key={name} style={{borderBottom:"1px solid #1f2937"}}><td style={{padding:"8px 10px",color:"#f1f5f9",fontWeight:600}}>{name}</td><td style={{padding:"8px 10px",color:"#34d399",fontFamily:"monospace"}}>{fmt(d.income)}</td><td style={{padding:"8px 10px",color:"#f87171",fontFamily:"monospace"}}>{fmt(d.expense)}</td><td style={{padding:"8px 10px",color:pr>=0?"#34d399":"#f87171",fontWeight:700,fontFamily:"monospace"}}>{fmt(pr)}</td><td style={{padding:"8px 10px",color:mg>=0?"#34d399":"#f87171"}}>{mg}%</td></tr>;})}</tbody>
        </table>
      </Sec>
    </div>

    {/* By account */}
    <div style={{background:"#1f2937",borderRadius:14,border:"1px solid #374151",padding:18}}>
      <Sec title="By Bank Account">
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {Object.entries(byAcc).map(([acc,d])=>{const bal=d.income-d.expense;return <div key={acc} style={{background:"#111827",borderRadius:10,padding:"12px 18px",border:"1px solid #374151",minWidth:160}}><div style={{fontSize:11,color:"#6b7280",fontWeight:600}}>{acc}</div><div style={{fontSize:16,fontWeight:800,color:bal>=0?"#34d399":"#f87171",fontFamily:"monospace",marginTop:4}}>{fmt(bal)}</div><div style={{fontSize:10,color:"#6b7280",marginTop:2}}>In: {fmt(d.income)} | Out: {fmt(d.expense)}</div></div>;})}
        </div>
      </Sec>
    </div>

    {/* Monthly */}
    <div style={{background:"#1f2937",borderRadius:14,border:"1px solid #374151",padding:18}}>
      <Sec title="Monthly Breakdown">
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{borderBottom:"2px solid #374151"}}>{["Month","Income","Expenses","Net"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#6b7280",fontWeight:600,fontSize:10}}>{h}</th>)}</tr></thead>
          <tbody>{Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,d])=>{const n=d.income-d.expense;return <tr key={m} style={{borderBottom:"1px solid #1f2937"}}><td style={{padding:"8px 10px",color:"#d1d5db"}}>{m}</td><td style={{padding:"8px 10px",color:"#34d399",fontFamily:"monospace"}}>{fmt(d.income)}</td><td style={{padding:"8px 10px",color:"#f87171",fontFamily:"monospace"}}>{fmt(d.expense)}</td><td style={{padding:"8px 10px",color:n>=0?"#34d399":"#f87171",fontWeight:700,fontFamily:"monospace"}}>{fmt(n)}</td></tr>;})}</tbody>
        </table>
      </Sec>
    </div>

    {/* Full ledger */}
    <div style={{background:"#1f2937",borderRadius:14,border:"1px solid #374151",overflow:"hidden"}}>
      <div style={{padding:"14px 18px",borderBottom:"1px solid #374151"}}><span style={{fontSize:12,fontWeight:700,color:"#f1f5f9"}}>All Transactions ({sorted.length})</span></div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
        <thead><tr style={{background:"#111827"}}>{["Date","Project","Type","Amount","Account","Entity","Category","Ref"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",color:"#6b7280",fontSize:10}}>{h}</th>)}</tr></thead>
        <tbody>{sorted.slice(0,50).map(e=><tr key={e.id} style={{borderBottom:"1px solid #1f2937"}}><td style={{padding:"6px 8px",color:"#d1d5db"}}>{fmtDate(e.date)}</td><td style={{padding:"6px 8px",color:"#9ca3af"}}>{e.projectName}</td><td style={{padding:"6px 8px"}}><span style={{fontSize:10,fontWeight:600,color:e.type==="income"?"#34d399":e.type==="expense"?"#f87171":"#60a5fa"}}>{e.type}</span></td><td style={{padding:"6px 8px",fontFamily:"monospace",fontWeight:600,color:e.type==="income"?"#34d399":"#f87171"}}>{fmt(e.amount)}</td><td style={{padding:"6px 8px",color:"#6b7280"}}>{e.account}</td><td style={{padding:"6px 8px",color:"#d1d5db"}}>{e.entity}</td><td style={{padding:"6px 8px",color:"#6b7280"}}>{e.category}</td><td style={{padding:"6px 8px",color:"#6b7280",fontFamily:"monospace"}}>{e.invoiceRef}</td></tr>)}</tbody>
      </table>
    </div>
  </div>;
}

          <span style={{fontSize:13,fontWeight:800,color:"#f1f5f9",fontFamily:"monospace",width:90}}>{inv.number}</span>
          <span style={{fontSize:11,color:"#9ca3af",flex:1}}>{inv.description||"No description"}</span>
          <span style={{fontSize:12,fontWeight:700,color:"#60a5fa",fontFamily:"monospace"}}>{fmt(inv.total)}</span>
          {balance>0&&balance<inv.total&&<span style={{fontSize:10,color:"#f59e0b",fontWeight:600}}>Bal: {fmt(balance)}</span>}
          <Badge status={inv.status}/>
          <span style={{color:"#6b7280",fontSize:10}}>{co?.shortName||""}</span>
          <span style={{color:"#4b5563",transform:isExp?"rotate(90deg)":"none",transition:"transform .15s"}}>▸</span>
        </div>

        {isExp&&<div style={{padding:"0 20px 20px",borderTop:"1px solid #374151"}}>
          {/* Row 1: Number, dates */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginTop:14,marginBottom:12}}>
            <Inp dark label="Invoice #" value={inv.number} onChange={v=>upd(n=>{n.invoices[ii].number=v;})}/>
            <Inp dark label="Issue Date" type="date" value={inv.date} onChange={v=>upd(n=>{n.invoices[ii].date=v;})}/>
            <Inp dark label="Due Date" type="date" value={inv.dueDate} onChange={v=>upd(n=>{n.invoices[ii].dueDate=v;})}/>
          </div>
          {/* Row 2: Company, account, project link */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
            <Sel dark label="From Company" value={inv.companyId||""} onChange={v=>upd(n=>{n.invoices[ii].companyId=v;const fc=companies.find(c=>c.id===v);if(fc?.accounts?.[0])n.invoices[ii].accountId=fc.accounts.find(a=>a.isDefault)?.id||fc.accounts[0].id;})} options={companies.map(c=>({value:c.id,label:c.name}))}/>
            <Sel dark label="Bank Account" value={inv.accountId||""} onChange={v=>upd(n=>{n.invoices[ii].accountId=v;})} options={accs.map(a=>({value:a.id,label:`${a.bank} - ${a.accName}`}))}/>
            <Sel dark label="Link to Payment" value={inv.paymentRef||""} onChange={v=>upd(n=>{n.invoices[ii].paymentRef=v?parseInt(v):null;})} options={[{value:"",label:"— None —"},...p.payments.map(pay=>({value:String(pay.id),label:`#${pay.id} ${pay.phase}`}))]}/>
          </div>
          <Inp dark label="Description" value={inv.description} onChange={v=>upd(n=>{n.invoices[ii].description=v;})} ph="e.g. Payment for metal fabrication" style={{marginBottom:12}}/>

          {/* Line items */}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:10,fontWeight:600,color:"#6b7280",display:"block",marginBottom:6}}>Line Items</label>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{borderBottom:"1px solid #374151"}}>{["Description","Qty","Unit","Price","Total",""].map(h=><th key={h} style={{padding:"4px 6px",textAlign:"left",color:"#6b7280",fontSize:10}}>{h}</th>)}</tr></thead>
              <tbody>{(inv.items||[]).map((it,li)=>{
                const lt=(it.qty||0)*(it.price||0);
                return <tr key={li} style={{borderBottom:"1px solid #1f2937"}}>
                  <td style={{padding:3}}><input value={it.desc} onChange={e=>upd(n=>{n.invoices[ii].items[li].desc=e.target.value;recalcInvoice(n.invoices[ii]);})} style={dkInp}/></td>
                  <td style={{padding:3,width:60}}><input type="number" value={it.qty} onChange={e=>upd(n=>{n.invoices[ii].items[li].qty=parseFloat(e.target.value)||0;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,textAlign:"right"}}/></td>
                  <td style={{padding:3,width:50}}><input value={it.unit||""} onChange={e=>upd(n=>{n.invoices[ii].items[li].unit=e.target.value;})} style={dkInp}/></td>
                  <td style={{padding:3,width:110}}><input type="number" value={it.price} onChange={e=>upd(n=>{n.invoices[ii].items[li].price=parseFloat(e.target.value)||0;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,textAlign:"right"}}/></td>
                  <td style={{padding:"3px 6px",color:"#60a5fa",fontWeight:600,fontFamily:"monospace",fontSize:11,textAlign:"right"}}>{fmt(lt)}</td>
                  <td style={{padding:3,width:24}}><button onClick={()=>upd(n=>{n.invoices[ii].items.splice(li,1);recalcInvoice(n.invoices[ii]);})} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer"}}>✕</button></td>
                </tr>;})}</tbody>
            </table>
            <Btn v="dark" onClick={()=>upd(n=>{n.invoices[ii].items.push({desc:"",qty:1,unit:"Ls",price:0});recalcInvoice(n.invoices[ii]);})} style={{marginTop:6,fontSize:10,padding:"4px 10px"}}>+ Line</Btn>
          </div>

          {/* Tax & discount toggles */}
          <div style={{background:"#111827",borderRadius:10,padding:14,marginBottom:12,border:"1px solid #374151"}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:16,fontSize:12}}>
              <label style={{color:"#9ca3af",display:"flex",alignItems:"center",gap:6}}><input type="checkbox" checked={!!inv.discountEnabled} onChange={e=>upd(n=>{n.invoices[ii].discountEnabled=e.target.checked;recalcInvoice(n.invoices[ii]);})}/>Discount</label>
              {inv.discountEnabled&&<input type="number" value={inv.discountAmount||0} onChange={e=>upd(n=>{n.invoices[ii].discountAmount=parseFloat(e.target.value)||0;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,width:120}} placeholder="Amount"/>}

              <label style={{color:"#9ca3af",display:"flex",alignItems:"center",gap:6}}><input type="checkbox" checked={!!inv.ppnEnabled} onChange={e=>upd(n=>{n.invoices[ii].ppnEnabled=e.target.checked;recalcInvoice(n.invoices[ii]);})}/>PPN</label>
              {inv.ppnEnabled&&<><input type="number" value={inv.ppnRate||11} onChange={e=>upd(n=>{n.invoices[ii].ppnRate=parseFloat(e.target.value)||0;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,width:50}}/><span style={{color:"#6b7280"}}>%</span>
              <select value={inv.ppnMode||"extra"} onChange={e=>upd(n=>{n.invoices[ii].ppnMode=e.target.value;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,width:80}}><option value="extra">Extra</option><option value="included">Incl</option></select></>}

              <label style={{color:"#9ca3af",display:"flex",alignItems:"center",gap:6}}><input type="checkbox" checked={!!inv.pphEnabled} onChange={e=>upd(n=>{n.invoices[ii].pphEnabled=e.target.checked;recalcInvoice(n.invoices[ii]);})}/>PPH 23</label>
              {inv.pphEnabled&&<><input type="number" value={inv.pphRate||2.85} onChange={e=>upd(n=>{n.invoices[ii].pphRate=parseFloat(e.target.value)||0;recalcInvoice(n.invoices[ii]);})} style={{...dkInp,width:50}}/><span style={{color:"#6b7280"}}>%</span></>}

              <label style={{color:"#9ca3af",display:"flex",alignItems:"center",gap:6}}><input type="checkbox" checked={!!inv.retentionEnabled} onChange={e=>upd(n=>{n.invoices[ii].retentionEnabled=e.target.checked;recalcInvoice(n.invoices[ii]);})}/>Retention 5%</label>
            </div>
          </div>

          {/* Totals */}
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
            <div style={{width:280}}>
              <div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}><span style={{color:"#9ca3af"}}>Subtotal</span><span style={{color:"#f1f5f9",fontFamily:"monospace",fontWeight:600}}>{fmt(inv.subtotal)}</span></div>
              {inv.discountEnabled&&inv.discountAmount>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}><span style={{color:"#f59e0b"}}>Discount</span><span style={{color:"#f59e0b",fontFamily:"monospace"}}>-{fmt(inv.discountAmount)}</span></div>}
              {inv.ppnEnabled&&inv.taxPPN>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}><span style={{color:"#60a5fa"}}>PPN {inv.ppnRate}%</span><span style={{color:"#60a5fa",fontFamily:"monospace"}}>+{fmt(inv.taxPPN)}</span></div>}
              {inv.pphEnabled&&inv.taxPPH>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}><span style={{color:"#c084fc"}}>PPH 23 ({inv.pphRate}%)</span><span style={{color:"#c084fc",fontFamily:"monospace"}}>-{fmt(inv.taxPPH)}</span></div>}
              {inv.retentionEnabled&&inv.retention>0&&<div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}><span style={{color:"#d97706"}}>Retention 5%</span><span style={{color:"#d97706",fontFamily:"monospace"}}>-{fmt(inv.retention)}</span></div>}
              <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:14,borderTop:"2px solid #374151",marginTop:4}}><span style={{fontWeight:800,color:"#f1f5f9"}}>GRAND TOTAL</span><span style={{fontWeight:800,fontFamily:"monospace",color:"#60a5fa"}}>{fmt(inv.total)}</span></div>
            </div>
          </div>

          {/* Partial payments */}
          <div style={{background:"#111827",borderRadius:10,padding:14,marginBottom:12,border:"1px solid #374151"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:700,color:"#6b7280"}}>Payments Received ({(inv.payments||[]).length})</span>
              <Btn v="dark" onClick={()=>upd(n=>{if(!n.invoices[ii].payments)n.invoices[ii].payments=[];n.invoices[ii].payments.push({id:uid(),date:today(),amount:0,method:"Bank Transfer",note:""});})} style={{fontSize:10,padding:"3px 8px"}}>+ Payment</Btn>
            </div>
            {(inv.payments||[]).map((pp,pi)=>(
              <div key={pp.id} style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                <input type="date" value={pp.date} onChange={e=>upd(n=>{n.invoices[ii].payments[pi].date=e.target.value;})} style={{...dkInp,width:120}}/>
                <input type="number" value={pp.amount} onChange={e=>upd(n=>{n.invoices[ii].payments[pi].amount=parseFloat(e.target.value)||0;})} style={{...dkInp,width:120,textAlign:"right"}} placeholder="Amount"/>
                <input value={pp.method||""} onChange={e=>upd(n=>{n.invoices[ii].payments[pi].method=e.target.value;})} style={{...dkInp,flex:1}} placeholder="Method"/>
                <input value={pp.note||""} onChange={e=>upd(n=>{n.invoices[ii].payments[pi].note=e.target.value;})} style={{...dkInp,flex:1}} placeholder="Note"/>
                <button onClick={()=>upd(n=>{n.invoices[ii].payments.splice(pi,1);})} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer"}}>✕</button>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:12}}>
              <span style={{color:"#6b7280"}}>Paid: <span style={{color:"#34d399",fontWeight:700,fontFamily:"monospace"}}>{fmt(totalPaid)}</span></span>
              <span style={{color:balance>0?"#f59e0b":"#34d399",fontWeight:700}}>Balance: {fmt(balance)}</span>
            </div>
          </div>

          {/* Status */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <Sel dark label="Status" value={inv.status} onChange={v=>upd(n=>{n.invoices[ii].status=v;if(v==="paid"&&!n.invoices[ii].paidDate)n.invoices[ii].paidDate=today();if(v==="paid"&&n.invoices[ii].paymentRef){const pp=n.payments.find(x=>x.id===n.invoices[ii].paymentRef);if(pp){pp.status="paid";pp.paidDate=today();}}})} options={[{value:"draft",label:"Draft"},{value:"sent",label:"Sent"},{value:"paid",label:"Paid"},{value:"overdue",label:"Overdue"},{value:"cancelled",label:"Cancelled"}]}/>
            <Inp dark label="Notes" value={inv.notes||""} onChange={v=>upd(n=>{n.invoices[ii].notes=v;})} ph="Transfer ref"/>
            <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
              <Btn v="danger" onClick={()=>upd(n=>{n.invoices.splice(ii,1);})} style={{padding:"8px 12px",fontSize:11}}>✕ Delete</Btn>
            </div>
          </div>
        </div>}
      </div>;
    })}

    {(p.invoices||[]).length>0&&<div style={{background:"#111827",borderRadius:10,padding:14,border:"1px solid #374151"}}>
      <div style={{fontSize:12,color:"#6b7280"}}>
        Invoiced: <span style={{color:"#60a5fa",fontWeight:700,fontFamily:"monospace"}}>{fmt((p.invoices||[]).filter(x=>x.status!=="cancelled").reduce((s,x)=>s+x.total,0))}</span>
        <span style={{margin:"0 8px"}}>•</span>
        Received: <span style={{color:"#34d399",fontWeight:700,fontFamily:"monospace"}}>{fmt((p.invoices||[]).reduce((s,inv)=>s+(inv.payments||[]).reduce((ss,pp)=>ss+pp.amount,0),0))}</span>
        <span style={{margin:"0 8px"}}>•</span>
        Outstanding: <span style={{color:"#f59e0b",fontWeight:700,fontFamily:"monospace"}}>{fmt((p.invoices||[]).filter(x=>x.status!=="cancelled"&&x.status!=="paid").reduce((s,x)=>s+x.total-(x.payments||[]).reduce((ss,pp)=>ss+pp.amount,0),0))}</span>
      </div>
    </div>}
  </div>;
}

// ═══ LEDGER / ОБОРОТНАЯ ВЕДОМОСТЬ ════════════════════════════════
function LedgerAdmin({p,upd,show}) {
  const [filter,setFilter]=useState("all");
  const ledger = p.ledger||[];
  const sorted = [...ledger].sort((a,b)=>b.date.localeCompare(a.date));
  const filtered = filter==="all"?sorted:sorted.filter(e=>e.type===filter);

  const totIncome = ledger.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);
  const totExpense = ledger.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
  const totTransfer = ledger.filter(e=>e.type==="transfer").reduce((s,e)=>s+e.amount,0);
  const balance = totIncome - totExpense;

  // Group by account
  const byAccount = {};
  ledger.forEach(e=>{
    if(!byAccount[e.account]) byAccount[e.account]={income:0,expense:0};
    if(e.type==="income") byAccount[e.account].income+=e.amount;
    if(e.type==="expense") byAccount[e.account].expense+=e.amount;
  });

  const dkInp = {width:"100%",padding:"5px 7px",borderRadius:5,border:"1px solid #374151",background:"#111827",color:"#d1d5db",fontSize:11,outline:"none",boxSizing:"border-box"};

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    {/* Summary cards */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
      {[{l:"Income",v:totIncome,c:"#34d399"},{l:"Expenses",v:totExpense,c:"#f87171"},{l:"Transfers",v:totTransfer,c:"#60a5fa"},{l:"Balance",v:balance,c:balance>=0?"#34d399":"#f87171"}].map(s=>(
        <div key={s.l} style={{background:"#1f2937",borderRadius:10,padding:14,border:"1px solid #374151",textAlign:"center"}}>
          <div style={{fontSize:10,color:"#6b7280",fontWeight:600}}>{s.l}</div>
          <div style={{fontSize:18,fontWeight:800,color:s.c,fontFamily:"monospace",marginTop:4}}>{fmt(s.v)}</div>
        </div>
      ))}
    </div>

    {/* Account balances */}
    {Object.keys(byAccount).length>0&&<div style={{background:"#1f2937",borderRadius:10,padding:14,border:"1px solid #374151"}}>
      <span style={{fontSize:11,fontWeight:700,color:"#6b7280",display:"block",marginBottom:8}}>Balance by Account</span>
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        {Object.entries(byAccount).map(([acc,data])=>(
          <div key={acc} style={{background:"#111827",borderRadius:8,padding:"8px 14px",border:"1px solid #374151"}}>
            <div style={{fontSize:10,color:"#6b7280"}}>{acc}</div>
            <div style={{fontSize:13,fontWeight:700,color:data.income-data.expense>=0?"#34d399":"#f87171",fontFamily:"monospace"}}>{fmt(data.income-data.expense)}</div>
          </div>
        ))}
      </div>
    </div>}

    {/* Controls */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:6}}>
        {["all","income","expense","transfer"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:"5px 12px",borderRadius:8,border:"none",background:filter===f?"rgba(37,99,235,.2)":"#1f2937",color:filter===f?"#60a5fa":"#9ca3af",fontSize:11,fontWeight:600,cursor:"pointer",textTransform:"capitalize"}}>{f}</button>
        ))}
      </div>
      <Btn onClick={()=>upd(n=>{if(!n.ledger)n.ledger=[];n.ledger.push({id:uid(),date:today(),type:"income",amount:0,account:"",project:p.project,entity:"",category:"From client",invoiceRef:"",desc:""});show("Entry added");})}>+ Add Entry</Btn>
    </div>

    {/* Ledger table */}
    <div style={{background:"#1f2937",borderRadius:14,border:"1px solid #374151",overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
        <thead><tr style={{background:"#111827",borderBottom:"2px solid #374151"}}>
          {["Date","Amount","Type","Account","Project","Entity","Category","Invoice","Description",""].map(h=>(
            <th key={h} style={{padding:"8px 6px",textAlign:"left",color:"#6b7280",fontWeight:600,fontSize:10}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {filtered.map((e,ei)=>{
            const origIdx = ledger.indexOf(e);
            return <tr key={e.id} style={{borderBottom:"1px solid #1f2937"}}>
              <td style={{padding:3}}><input type="date" value={e.date} onChange={ev=>upd(n=>{n.ledger[origIdx].date=ev.target.value;})} style={{...dkInp,width:110}}/></td>
              <td style={{padding:3}}><input type="number" value={e.amount} onChange={ev=>upd(n=>{n.ledger[origIdx].amount=parseFloat(ev.target.value)||0;})} style={{...dkInp,width:100,textAlign:"right",color:e.type==="income"?"#34d399":e.type==="expense"?"#f87171":"#60a5fa"}}/></td>
              <td style={{padding:3}}><select value={e.type} onChange={ev=>upd(n=>{n.ledger[origIdx].type=ev.target.value;})} style={{...dkInp,width:80}}><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option></select></td>
              <td style={{padding:3}}><input value={e.account||""} onChange={ev=>upd(n=>{n.ledger[origIdx].account=ev.target.value;})} style={{...dkInp,width:100}} placeholder="BCA..."/></td>
              <td style={{padding:3}}><input value={e.project||""} onChange={ev=>upd(n=>{n.ledger[origIdx].project=ev.target.value;})} style={{...dkInp,width:120}}/></td>
              <td style={{padding:3}}><input value={e.entity||""} onChange={ev=>upd(n=>{n.ledger[origIdx].entity=ev.target.value;})} style={{...dkInp,width:110}}/></td>
              <td style={{padding:3}}><input value={e.category||""} onChange={ev=>upd(n=>{n.ledger[origIdx].category=ev.target.value;})} style={{...dkInp,width:90}}/></td>
              <td style={{padding:3}}><input value={e.invoiceRef||""} onChange={ev=>upd(n=>{n.ledger[origIdx].invoiceRef=ev.target.value;})} style={{...dkInp,width:80}}/></td>
              <td style={{padding:3}}><input value={e.desc||""} onChange={ev=>upd(n=>{n.ledger[origIdx].desc=ev.target.value;})} style={{...dkInp}}/></td>
              <td style={{padding:3}}><button onClick={()=>upd(n=>{n.ledger.splice(origIdx,1);})} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer"}}>✕</button></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </div>;
}

// ═══ ADMIN FORM COMPONENTS (proper hooks) ═════════════════════════
function AddUpdateAdmin({onAdd}) {
  const [t,sT]=useState(""); const [tx,sTx]=useState(""); const [tp,sTp]=useState("update");
  return <Card dark><Sec title="Post Update">
    <Inp dark label="Title" value={t} onChange={sT} ph="e.g. Foundation complete"/>
    <Txta dark label="Description" value={tx} onChange={sTx}/>
    <Sel dark label="Type" value={tp} onChange={sTp} options={[{value:"update",label:"Update"},{value:"milestone",label:"Milestone"}]}/>
    <Btn onClick={()=>{if(!t.trim())return;onAdd(t,tx,tp);sT("");sTx("");}}>✓ Post</Btn>
  </Sec></Card>;
}

function AddPhotoAdmin({onAdd}) {
  const [c,sC]=useState(""); const [pr,sPr]=useState(null);
  return <Card dark><Sec title="Upload Photo">
    <Inp dark label="Caption" value={c} onChange={sC} ph="e.g. Retaining wall"/>
    <div style={{marginBottom:12}}><label style={{fontSize:10,fontWeight:600,color:"#6b7280",display:"block",marginBottom:4}}>Photo</label>
      <input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>sPr(ev.target.result);r.readAsDataURL(f);}} style={{fontSize:11,color:"#d1d5db"}}/></div>
    {pr&&<img src={pr} alt="" style={{maxWidth:260,maxHeight:180,borderRadius:8,marginBottom:12,border:"1px solid #374151"}}/>}
    <Btn onClick={()=>{if(!c.trim())return;onAdd(c,pr);sC("");sPr(null);}}>✓ Upload</Btn>
  </Sec></Card>;
}

// ═══ ADMIN COMMENTS VIEW ══════════════════════════════════════════
function AdminCommentsView({projectId}) {
  const [coms,setComs]=useState([]);
  const [loaded,setLoaded]=useState(false);
  useEffect(()=>{(async()=>{const c=await DB.get(`kps-comments:${projectId}`);if(c)setComs(c);setLoaded(true);})();},[projectId]);

  if(!loaded) return <div style={{color:"#6b7280",padding:20}}>Loading...</div>;

  return <Card dark>
    <Sec title={`Supervisor Comments (${coms.length})`}>
      {coms.length===0?<div style={{color:"#6b7280",padding:20,textAlign:"center"}}>No supervisor comments yet. Comments from Tech/Author supervisors will appear here.</div>:
      coms.map(c=><div key={c.id} style={{padding:"10px 0",borderBottom:"1px solid #374151",opacity:c.resolved?.6:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <RoleBadge role={c.role}/><span style={{fontSize:11,fontWeight:700,color:"#f1f5f9"}}>{c.author}</span>
          <span style={{fontSize:10,color:"#6b7280"}}>{fmtDate(c.date)}</span>
          {c.phase&&<span style={{fontSize:10,color:"#60a5fa",background:"rgba(37,99,235,.15)",padding:"1px 6px",borderRadius:4}}>{c.phase}</span>}
          <span style={{fontSize:10,color:c.resolved?"#34d399":"#f59e0b",fontWeight:600,marginLeft:"auto"}}>{c.resolved?"✓ Resolved":"○ Open"}</span>
        </div>
        <div style={{fontSize:12,color:"#d1d5db",lineHeight:1.5}}>{c.text}</div>
      </div>)}
    </Sec>
  </Card>;
}

// ═══ ROOT APP ═════════════════════════════════════════════════════
function App() {
  const [mode,setMode]=useState(null);
  const [projects,setProjects]=useState([]);
  const [activeProject,setActiveProject]=useState(null);
  const [role,setRole]=useState(null);
  const [error,setError]=useState(false);
  const [saving,setSaving]=useState(false);
  const [loaded,setLoaded]=useState(false);
  const [adminKey,setAdminKey]=useState("ADMIN-KPS-2026");
  const saveTimer=useRef(null);

  // Load all projects on mount
  useEffect(()=>{
    (async()=>{
      // Load admin key
      const storedKey = await DB.get("kps-admin-key");
      if(storedKey) setAdminKey(storedKey); else await DB.set("kps-admin-key","ADMIN-KPS-2026");

      let idx = await DB.get("kps-project-index");
      if(!idx) idx = [];
      const all = [];
      for (const entry of idx) {
        const p = await DB.get(`kps-project:${entry.id}`);
        if(p) all.push(p);
      }
      setProjects(all);
      setLoaded(true);
    })();
  },[]);

  const saveProject = useCallback((proj)=>{
    setProjects(prev=>prev.map(p=>p.id===proj.id?proj:p));
    setActiveProject(proj);
    setSaving(true);
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async()=>{
      await DB.set(`kps-project:${proj.id}`, proj);
      setSaving(false);
    },800);
  },[]);

  const createProject = useCallback(async(proj)=>{
    await DB.set(`kps-project:${proj.id}`, proj);
    const idx = await DB.get("kps-project-index")||[];
    idx.push({id:proj.id});
    await DB.set("kps-project-index", idx);
    setProjects(prev=>[...prev,proj]);
  },[]);

  const changeAdminKey = useCallback(async(newKey)=>{
    setAdminKey(newKey);
    await DB.set("kps-admin-key",newKey);
  },[]);

  const handleLogin = (key)=>{
    const trimmed=key.trim();
    if(trimmed===(adminKey||"ADMIN-KPS-2026")){setMode("admin-list");setError(false);return;}
    // Search all projects for matching access key
    for(const p of projects){
      const ak=(p.accessKeys||[]).find(a=>a.key===trimmed);
      if(ak){ setActiveProject(p); setRole(ak.role); setMode("client"); setError(false); return; }
      // Legacy: project id itself as client key
      if(p.id===trimmed){ setActiveProject(p); setRole("client"); setMode("client"); setError(false); return; }
    }
    setError(true);
  };

  const logout = ()=>{setMode(null);setActiveProject(null);setRole(null);setError(false);};

  if(!loaded) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0f172a"}}><div style={{color:"#60a5fa",fontSize:14,fontFamily:"'DM Sans',sans-serif"}}>Loading...</div></div>;

  if(!mode) return <Login onLogin={handleLogin} error={error}/>;
  if(mode==="client"&&activeProject) return <ClientView project={activeProject} role={role} onLogout={logout}/>;
  if(mode==="admin-list") return <Admin projects={projects} onSelectProject={id=>{setActiveProject(projects.find(p=>p.id===id));setMode("admin-edit");}} onCreateProject={createProject} onLogout={logout} adminKey={adminKey} onChangeAdminKey={changeAdminKey}/>;
  if(mode==="admin-edit"&&activeProject) return <AdminProject project={activeProject} onChange={saveProject} onBack={()=>setMode("admin-list")} saving={saving}/>;
  return null;
}


// Mount
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
